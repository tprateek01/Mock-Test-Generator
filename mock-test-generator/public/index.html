<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C2541" />


    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mocksy" />
    <meta name="application-name" content="Mocksy" />
    <!-- Fonts: loaded asynchronously so the font CSS request doesn't block
         first paint. preload fetches it in parallel with everything else;
         onload swaps it in as a real stylesheet once it arrives. The
         <noscript> fallback covers the (rare) no-JS case. display=swap in
         the URL means text renders immediately in a fallback font and swaps
         to the webfont when it's ready, instead of staying invisible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&family=Pacifico&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&family=Pacifico&display=swap"
      />
    </noscript>

    <!-- Primary SEO tags -->
    <!--
      title / description / canonical / og:url / og:title / og:description /
      twitter:url / twitter:title / twitter:description are intentionally
      NOT hard-coded here anymore. This file is served as-is for every route
      (see vercel.json rewrites), so a static canonical/title here was
      forcing every page — /contact, /create, /privacy — to declare the
      homepage as canonical. Each route now renders its own via <SeoHead>
      (src/components/SeoHead.jsx), which is the single source of truth.
      Keep this file to only the tags that are genuinely the same on every
      route (robots, keywords, image, card type, etc).
    -->
    <meta
      name="keywords"
      content="mock test generator, mocksy, online mock test, free mock test maker, question paper to test, GATE mock test, SSC mock test, UPSC mock test, exam practice test generator, PDF to test converter, timed test generator, auto grading test"
    />
    <meta name="author" content="Mocksy" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp preview (url/title/description set per-route by SeoHead) -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://mocksy-app.vercel.app/logo512.png" />
    <meta property="og:site_name" content="Mocksy" />

    <!-- Twitter / X card (url/title/description set per-route by SeoHead) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mocksy-app.vercel.app/logo512.png" />

    <!-- Structured data so Google understands this is a free web app, not just a page -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Mocksy",
        "alternateName": "Mocksy Mock Test Generator",
        "url": "https://mocksy-app.vercel.app/",
        "description": "Free online mock test generator. Upload any question paper (PDF, Word, image, or pasted text) and get an instant timed, proctored, auto-graded mock test.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (Web-based)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
